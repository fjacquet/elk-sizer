name: Release Build

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Create release artifact
        run: tar -czf elk-sizer-${{ github.event.release.tag_name }}.tar.gz -C dist .

      - name: Upload to release
        run: gh release upload ${{ github.event.release.tag_name }} elk-sizer-${{ github.event.release.tag_name }}.tar.gz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
